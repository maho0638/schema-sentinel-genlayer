name: SchemaSentinel Studionet Proof (manual)
on:
  workflow_dispatch:
jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sha256sum contracts/schema_sentinel.py
      - run: gltest tests/integration/test_schema_sentinel_studionet.py -v -s --network studionet
